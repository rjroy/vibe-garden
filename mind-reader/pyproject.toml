[project]
name = "mind-reader"
version = "0.1.0"
description = "Analyze Claude Code usage history for insights"
authors = [{ name = "Ronald Roy", email = "gsdwig@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]
ml = ["bertopic>=0.16", "sentence-transformers>=3.0"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "UP", "I", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
