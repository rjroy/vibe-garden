[project]
name = "mind-reader"
version = "1.0.0"
description = "Active feedback based on session patterns and sentiment analysis"
authors = [{ name = "Ronald Roy", email = "gsdwig@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sentiment = ["vaderSentiment>=3.3"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]
sentiment = ["vaderSentiment>=3.3"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "UP", "I", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
