[project]
name = "notify-hook"
version = "1.0.0"
description = "Claude Code plugin for desktop/mobile notifications"
authors = [
    {name = "Ronald Roy", email = "gsdwig@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/rjroy/vibe-garden"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
