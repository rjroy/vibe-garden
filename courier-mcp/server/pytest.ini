[pytest]
# Pytest configuration for Courier MCP

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
    --color=yes

# Markers
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real Gmail API (requires credentials)
    acceptance: Acceptance tests mapping to spec requirements
    slow: Tests that take >5 seconds to run

# Asyncio settings
asyncio_mode = auto

# Coverage settings (optional)
# addopts = --cov=courier_mcp --cov-report=term-missing

# Test paths
testpaths = tests

# Ignore paths
norecursedirs = .git .tox dist build *.egg venv
